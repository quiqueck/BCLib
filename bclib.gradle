buildscript {
    dependencies {
        classpath 'org.kohsuke:github-api:1.114'
    }

    repositories {
        gradlePluginPortal()
    }
}
java.sourceCompatibility = JavaVersion.VERSION_25
java.targetCompatibility = JavaVersion.VERSION_25

base.archivesName = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {
    maven { url "https://maven.dblsaiko.net/" }
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://maven.shedaniel.me/" }
    maven { url 'https://maven.blamejared.com' }
    maven { url 'https://jitpack.io' }
    maven { url 'https://maven.terraformersmc.com/releases' }
    maven { url 'https://maven.terraformersmc.com' }
    maven { url 'https://maven.ambertation.de/releases' }
}

java {
    withSourcesJar()
}

loom {
    accessWidenerPath = file("src/main/resources/bclib.accesswidener")
    runs {
        // This adds a new gradle task that runs the datagen API: "gradlew runDatagenClient"
        datagenClient {
            inherit client
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
            vmArg "-Dfabric-api.datagen.strict-validation"
            vmArg "-Dfabric-api.datagen.modid=${project.archives_base_name}"

            runDir "build/datagen"
        }

        // Regenerates the four vanilla-namespace audit snapshots - block_properties.json,
        // block_registrations.json, item_registrations.json, block_shapes.txt - into the shared
        // minecraft reference checkout that sits next to the mod repos in the workspace.
        // Usage: "gradlew :runMinecraftAudit" (the leading colon matters, see common-settings.gradle).
        //
        // Deliberately not a datagen run of the mod itself: MinecraftAuditDatagen swaps the
        // providers over to a 'minecraft' ModCore and suppresses everything else, so the only
        // thing that lands in the output folder is those four files. strict-validation is left
        // off on purpose - it is meant for a mod generating its own registry content, which this
        // run does not do.
        minecraftAudit {
            inherit client
            name "Minecraft Audit Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("../minecraft/src/main/generated")}"
            vmArg "-Dfabric-api.datagen.modid=${project.archives_base_name}"
            // Keep in sync with MinecraftAuditDatagen.PROPERTY.
            vmArg "-Dwover.datagen.minecraft-audit"

            runDir "build/datagen"
        }
    }
    if (findProject(':WorldWeaver') != null || findProject(':wunderlib') != null) {
        enableTransitiveAccessWideners = true
    }
}


// The audit writes outside this repository, into a checkout that a fresh clone will not have.
// Without this the run would quietly create an empty minecraft/src/main/generated next to the
// repo and report success, leaving the real reference checkout untouched.
tasks.named("runMinecraftAudit") {
    doFirst {
        def reference = file("../minecraft/src")
        if (!reference.isDirectory()) {
            throw new GradleException(
                    "The minecraft reference checkout was not found at '${reference}'.\n" +
                            "runMinecraftAudit writes the vanilla audit snapshots into that workspace folder;\n" +
                            "check it out next to the mod repos before running this task."
            )
        }
    }
}

sourceSets {
    main {
        // Add the datagenned files into the jar.
        resources {
            srcDirs += [
                    'src/main/generated'
            ]
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

//    compileOnly "dev.emi:emi-fabric:${emi_version}:api"
//    localRuntime "dev.emi:emi-fabric:${emi_version}"

    compileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}" // compile against the API
    localRuntime "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}" // run against the full jar

    // alsoInclude=false: BCLib doesn't bundle wunderlib into its own jar,
    // just needs it on the classpath (same as WorldWeaver's own submodules).
    gradle.modApiOrLocal(dependencies, ':wunderlib', "de.ambertation:wunderlib:${project.wunderlib_version}", false)

    if (findProject(':WorldWeaver') != null) {
        implementation project(path: ":WorldWeaver", configuration: 'localDev')

        gradle.knownWoverModules.each {
            implementation project(path: ":WorldWeaver:$it", configuration: 'dev')
            // BCLib doesn't split its own client/common sources, so its single sourceSet needs each
            // wover module's client output too (WorldWeaver itself now enforces the split - see
            // common.gradle's devClient configuration).
            implementation project(path: ":WorldWeaver:$it", configuration: 'devClient')
        }
    } else {
        implementation "org.betterx:worldweaver:${project.wover_version}"
    }
}

processResources {
    println "Version: ${project.mod_version}"
    inputs.property "version", project.mod_version

    filesMatching("fabric.mod.json") {
        expand "version": project.mod_version
    }
}

// ensure that the encoding is set to UTF-8, no matter what the system default is
// this fixes some edge cases with special characters not displaying correctly
// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

javadoc {
    options {
        source = "25"
        encoding = "UTF-8"
        charSet = "UTF-8"
        tags = ["reason"]
        memberLevel = JavadocMemberLevel.PROTECTED
        links("https://docs.oracle.com/en/java/javase/17/docs/api/")
        // Disable the crazy super-strict doclint tool in Java 8
        addStringOption("Xdoclint:none", "-quiet")
        addStringOption("noqualifier", "net.minecraft.*:com.mojang.*:net.fabricmc.*")
        addBooleanOption("-allow-script-in-comments", true)
        tags(
                'apiNote:a:API Note:',
                'implSpec:a:Implementation Requirements:',
                'implNote:a:Implementation Note:'
        )
        stylesheetFile = new File(projectDir, "javadoc.css")
    };
}

subprojects { subproject ->
    subproject.tasks.withType(Javadoc) { javadocTask ->
        javadocTask.failOnError false
        javadocTask.enabled = false
    }

    subproject.tasks.withType(Jar) { jarTask ->
        if (jarTask.name == 'javadocJar') {
            jarTask.enabled = false
        }
    }
}


task javadocJar(type: Jar, dependsOn: javadoc) {
    archiveClassifier = 'javadoc'
    from javadoc.destinationDir
}

// Loom will automatically attach sourcesJar to the "build" task if it is
// present. If you remove this task, sources will not be generated.
tasks.sourcesJar {
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

jar {
    from "LICENSE"
    from "LICENSE.ASSETS"
}

configurations {
    dev {
        transitive true
        canBeConsumed true
        canBeResolved false
        extendsFrom api
    }
}

artifacts {
    dev jar
}

tasks.assemble.dependsOn(sourcesJar, javadocJar)

allprojects {
    // Allow 400 errors.
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xmaxerrs" << "5000"
        }
    }
}
