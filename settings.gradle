pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
    }
}

apply from: "common-settings.gradle"

// #### Custom Settings ####

// Change the next line to disable local lib loading, even if the sibling folders exist
def allowLocalLibUse = true

def WoverPath = '../WorldWeaver'

// #### Logic ####
includeLocalLib('wunderlib', '../WunderLib', './wunderlib-composit.gradle', allowLocalLibUse)

def WoverFolder = new File(WoverPath)
if (allowLocalLibUse && WoverFolder.exists()) {
    println "Using local WorldWeaver from '${WoverFolder}'"
    println "If you do not want to load the local version of WorldWeaver"
    println "either rename the folder containing it to something else,"
    println "or set 'allowLocalLibUse' to false."

    include ':WorldWeaver'
    project(":WorldWeaver").projectDir = WoverFolder
    project(':WorldWeaver').buildFileName = './build.composit.gradle'

    // Read WorldWeaver's own module list directly instead of keeping a
    // separate copy here - the old copy (wover-include.gradle) had drifted
    // out of sync with WorldWeaver's real list (missing wover-pottable-api,
    // and wrongly listing 'wunderlib' as if it were a WorldWeaver module).
    apply from: WoverFolder.toPath().resolve("module-include.gradle").toFile()
    gradle.ext.set("knownWoverModules", ext.knownWoverModules)

    ext.knownWoverModules.each { module ->
        def fullName = ":WorldWeaver:${module}"
        def path = WoverFolder.toPath().resolve(module).toFile()

        include fullName
        project(fullName).name = module

        println "Including module ${module} from ${path}"
    }
} else if (allowLocalLibUse) {
    logger.warn("WARNING: allowLocalLibUse is enabled but '${WoverFolder}' was not found - building against the published org.betterx:worldweaver Maven artifact instead.")
}
